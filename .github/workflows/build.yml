# 自動編譯：每次推送都用 devkitARM 編譯 hekate 與 Nyx，並產生繁中字型資源
name: 編譯

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4

      - name: 安裝編譯需要的工具
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential python3

      - name: 編譯 hekate 與 Nyx
        run: make -j"$(nproc)"

      - name: 產生繁中字型資源（res.pak）
        run: python3 tools/zh_tw/build_res.py tools/zh_tw/res_official.pak tools/zh_tw/cjk_glyphs.bin output/res.pak

      - name: 檢查版本與大小
        run: |
          ls -la output
          python3 - <<'PY'
          d = open('output/nyx.bin', 'rb').read()
          print('nyx.bin 大小：', len(d))
          print('0x9C 版本欄位：', d[0x9C:0xA0].hex())
          PY

      - name: 上傳成品
        uses: actions/upload-artifact@v4
        with:
          name: hekate-zh-tw
          path: output/

      - name: 發佈測試版（方便下載）
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: 測試版 ${{ github.run_number }}
          prerelease: true
          files: |
            output/nyx.bin
            output/res.pak
            output/hekate.bin
