# 自動編譯：每次推送都用 devkitARM 編譯 hekate 與 Nyx，並產生繁中字型資源
name: 編譯

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4

      - name: 安裝編譯需要的工具
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential python3 python3-pil fonts-noto-cjk

      - name: 編譯 hekate 與 Nyx
        run: make -j"$(nproc)"

      - name: 產生繁中字型資源（res.pak）
        if: hashFiles('tools/zh_tw/build_res.py') != ''
        run: python3 tools/zh_tw/build_res.py tools/zh_tw/res_official.pak output/res.pak

      - name: 檢查版本與大小
        run: |
          ls -la output
          python3 - <<'PY'
          d = open('output/nyx.bin', 'rb').read()
          print('nyx.bin 大小：', len(d))
          print('0x9C 版本欄位：', d[0x9C:0xA0].hex())
          PY

      - name: 上傳成品
        uses: actions/upload-artifact@v4
        with:
          name: hekate-zh-tw
          path: output/
